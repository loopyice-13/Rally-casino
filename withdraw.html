<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Withdraw • Rally Casino</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
  <script src="withdraw.js" defer></script>
</head>
<body>
  <div class="nav cinematic-glow">
    <div class="brand">
      <div class="brand-badge">♠</div>
      <div class="brand-title">
        <div data-site-name>Rally Casino</div>
        <span>withdraw</span>
      </div>
    </div>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="deposit.html">Deposit</a>
      <a class="active" href="withdraw.html">Withdraw</a>
      <a href="history.html">History</a>
    </div>
    <div class="wallet">
      <span class="pill" id="userText">Guest</span>
      <span><b id="balanceText">GHS 0.00</b></span>
    </div>
  </div>

  <div class="container">
    <section class="hero">
      <div class="card hero-main cinematic-glow">
        <div class="kicker">Cash out</div>
        <h1>Withdraw funds</h1>
        <p>Submit your payout request and track the status in history.</p>
      </div>

      <div class="card panel cinematic-glow">
        <form id="withdrawForm" class="form">
          <input class="field" name="amount" type="number" min="1" step="0.01" placeholder="Withdrawal amount" required />
          <input class="field" name="method" placeholder="Method: MoMo or Bank" required />
          <input class="field" name="accountName" placeholder="Account name" required />
          <input class="field" name="accountNumber" placeholder="Account number / wallet number" required />
          <input class="field" name="network" placeholder="Network / bank (optional)" />
          <textarea class="field" name="note" placeholder="Optional note"></textarea>
          <button class="btn btn-primary" type="submit">Submit withdrawal</button>
        </form>
      </div>
    </section>
  </div>
</body>
</html>
