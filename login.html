<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login • Rally Casino</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="nav cinematic-glow">
    <div class="brand">
      <div class="brand-badge">♠</div>
      <div class="brand-title">
        <div data-site-name>Rally Casino</div>
        <span>login</span>
      </div>
    </div>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="deposit.html">Deposit</a>
      <a href="withdraw.html">Withdraw</a>
      <a href="history.html">History</a>
      <a class="active" href="login.html">Login</a>
      <a href="signup.html">Sign up</a>
    </div>
    <div class="wallet">
      <span class="pill" id="userText">Guest</span>
      <span><b id="balanceText">GHS 0.00</b></span>
    </div>
  </div>

  <div class="container">
    <section class="hero">
      <div class="card hero-main cinematic-glow">
        <div class="kicker">Welcome back</div>
        <h1>Login to your Rally account</h1>
        <p>Access your wallet, deposit history, and pending balances from one clean dashboard.</p>
      </div>

      <div class="card panel cinematic-glow">
        <form id="loginForm" class="form">
          <input class="field" type="text" name="username" placeholder="Username" required />
          <input class="field" type="password" name="password" placeholder="Password" required />
          <div id="hcaptchaBox" class="h-captcha" data-theme="dark"></div>
          <button class="btn btn-primary" type="submit">Login</button>
          <a class="btn btn-secondary" href="signup.html" style="display:block;text-align:center">Create account</a>
        </form>
      </div>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('loginForm')?.addEventListener('submit', login);
      renderCaptcha('hcaptchaBox');
    });
  </script>
</body>
</html>
